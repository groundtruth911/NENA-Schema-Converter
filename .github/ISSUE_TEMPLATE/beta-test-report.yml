name: Beta test report
description: Report a completed public beta test, including runs with warnings.
title: "[Beta test]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing. Do not attach source data. Review logs and manifests before posting because GitHub issues are public.
  - type: input
    id: pro-version
    attributes:
      label: ArcGIS Pro version
      description: Use the full version shown in ArcGIS Pro.
      placeholder: "Example: 3.x.x"
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: "Example: Windows 11"
    validations:
      required: true
  - type: dropdown
    id: conversion
    attributes:
      label: Conversion tested
      options:
        - v2 to v3 flatfile
        - v1 to v2
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Data used
      options:
        - Fictional Cascade sample
        - Copy of local data
    validations:
      required: true
  - type: dropdown
    id: finished
    attributes:
      label: Did the run finish?
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Final status from the log
      options:
        - COMPLETE
        - COMPLETE WITH WARNINGS
        - PARTIAL
        - No final status
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Approximate run time
      placeholder: "Example: 2 minutes"
  - type: textarea
    id: observations
    attributes:
      label: What happened?
      description: Include warnings, unexpected behavior, and anything confusing.
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Reviewed attachments
      description: Drag in a screenshot, log, or manifest only after reviewing and redacting it. Never attach the source geodatabase.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not attach source data, and I reviewed all posted text and files for sensitive information.
          required: true
