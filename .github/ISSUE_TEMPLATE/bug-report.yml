name: Bug report
description: Report an error, failure, or unexpected conversion result.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. GitHub issues are public. Do not attach GIS data or include sensitive information.

  - type: input
    id: release
    attributes:
      label: Converter release
      description: Enter the release name shown in the downloaded file.
      value: "v0.9.0-rc1"
    validations:
      required: true

  - type: input
    id: arcgis-version
    attributes:
      label: ArcGIS Pro version
      placeholder: "Example: 3.x"
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: "Example: Windows 11"
    validations:
      required: false

  - type: input
    id: conversion-path
    attributes:
      label: Source and target model versions
      placeholder: "Source: ... / Target: ..."
    validations:
      required: true

  - type: textarea
    id: data-description
    attributes:
      label: General description of test data
      description: Describe the types of layers or tables involved. Do not attach or identify the dataset.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps that led to the problem.
      placeholder: |
        1. Opened ...
        2. Selected ...
        3. Ran ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: messages
    attributes:
      label: Error or warning text
      description: Paste the exact text when safe. Remove paths, names, or other sensitive details.
      render: shell
    validations:
      required: false

  - type: dropdown
    id: frequency
    attributes:
      label: How often does this happen?
      options:
        - Every time
        - Sometimes
        - Happened once
        - Not tested again
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Final checks
      options:
        - label: I tested with a copy of my data.
          required: true
        - label: I have not attached GIS data or included sensitive information in this issue.
          required: true
